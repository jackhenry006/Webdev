  <body>
    <h1>learning forms</h1>
    <h1>Student regestration</h1>
    <form action="">
      <fieldset>
        <legend>Student Information</legend>

        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Enter your name" />
        <br />
        <br />
        <label for="email">Email</label>
        <input id="email" type="text" placeholder="Enter your Email" />
        <br />
        <br />
        <label for="Phno">phno</label>
        <input id="Phno" type="text" placeholder="Enter your Phone num" />
      </fieldset>
      <br />
      <br />
      <fieldset>
        <legend>Address Details</legend>

        <label for="address">Address</label>
        <textarea name="" id="address" rows="3"></textarea>
        <br />
        <br />

        <label for="city">City</label>
        <select name="" id="city">
          <option value="">bhopal</option>
          <option value="">jeypore</option>
          <option value="">koraput</option>
          <option value="">Bihar</option>
          <option value="">mumbai</option>
        </select>
        <br />
        <br />

        <label for="Country">Country</label>
        <select name="" id="Country">
          <option value="">India</option>
          <option value="">Usa</option>
          <option value="">England</option>
          <option value="">Africa</option>
          <option value="">China</option>
        </select>
      </fieldset>
      <br /><br />

      <label for="course">Select Courses</label>
      <select name="" id="course">
        <optgroup label="Frontend">
          <option value="">Html</option>
          <option value="">Css</option>
          <option value="">Js</option>
        </optgroup>

        <label for=""></label>

        <optgroup label="Backend">
          <option value="">Node</option>
          <option value="">Express</option>
          <option value="">MongoDB</option>
        </optgroup>
      </select>

      <br />
      <br />

      <button>Submit form</button>
    </form>
